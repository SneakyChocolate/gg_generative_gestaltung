<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weihnachten — eine Kerze aus Text</title>

  <style>
    :root {
      --ink: #e8d9bd;
      --muted: #9f8e73;
      --gold: #d8a45a;
      --bg: #080604;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      touch-action: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Weiche Vignette: dunkelt die Raender ab, ohne das Zentrum zu verdecken. */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      background:
        radial-gradient(ellipse at 50% 54%, transparent 36%, rgba(0, 0, 0, 0.22) 70%, rgba(0, 0, 0, 0.72) 100%);
      mix-blend-mode: multiply;
    }

    #hud {
      position: fixed;
      left: clamp(18px, 4vw, 64px);
      bottom: clamp(20px, 5vh, 58px);
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.7s ease;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.7);
      max-width: min(620px, 80vw);
    }

    #hud.hidden { opacity: 0; }

    .kicker {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--gold);
      font-family: "Trebuchet MS", Verdana, sans-serif;
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    .kicker::before {
      content: "";
      width: 42px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
      opacity: 0.8;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4.6vw, 58px);
      font-weight: 400;
      letter-spacing: 0.14em;
      line-height: 0.95;
      text-transform: uppercase;
      color: #f1e4ca;
    }

    .subtitle {
      margin: 12px 0 18px;
      color: var(--muted);
      font-style: italic;
      font-size: clamp(13px, 1.25vw, 16px);
      letter-spacing: 0.02em;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      font-family: "Trebuchet MS", Verdana, sans-serif;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8d7c64;
    }

    .legend b {
      color: #c9ae80;
      font-weight: 400;
    }

    #debug {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 11;
      display: none;
      margin: 0;
      padding: 12px 14px;
      border: 1px solid rgba(216, 164, 90, 0.25);
      background: rgba(8, 6, 4, 0.72);
      color: #cdbb9d;
      font: 11px/1.55 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      white-space: pre;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

    #debug.visible { display: block; }

    #fade {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background: #000;
      opacity: 0;
      transition: opacity 1.1s ease;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #080604;
      color: #c9ae80;
      font-family: "Trebuchet MS", Verdana, sans-serif;
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      transition: opacity 0.9s ease;
    }

    #loader.done {
      opacity: 0;
      pointer-events: none;
    }

    #loader p { margin: 0; }

    #loader .error {
      max-width: 440px;
      text-align: center;
      line-height: 1.8;
      text-transform: none;
      letter-spacing: 0.05em;
      font-family: Georgia, serif;
      font-size: 14px;
      color: #d9b07a;
    }


    @media (max-width: 720px) {
      .legend { display: none; }
      .subtitle { margin-bottom: 0; }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="vignette"></div>

  <div id="hud" class="hidden">
  <div class="legend">
      <span><b>R</b> neu anz&uuml;nden</span>
      <span><b>P</b> Pause</span>
      <span><b>D</b> Debug</span>
      <span><b>H</b> UI</span>
    </div>
  </div>

  <pre id="debug"></pre>
  <div id="fade"></div>

  <div id="loader" class="done"></div>

  <!-- Einstiegspunkt: main.js ruft setup()/draw() aus sketch.js auf. -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
