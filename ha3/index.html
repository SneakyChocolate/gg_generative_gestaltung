      drop.velocity.y -= CONFIG.melt.gravity * dt;
      drop.velocity.multiplyScalar(Math.max(0, 1 - CONFIG.melt.drag * dt));
      drop.velocity.x += state.wind.x * CONFIG.melt.dropPush * dt;
      drop.velocity.z += state.wind.z * CONFIG.melt.dropPush * dt;
      drop.position.addScaledVector(drop.velocity, dt);

      // TABLE: Aufprall auf der Tischebene.
      if (drop.position.y - drop.radius <= CONFIG.tableY) {
        this.land(drop);
        this.drops.splice(i, 1);
      }
    }

    this.merge();
    this.updateInstances();
  }

  trySpawn() {
    const active = state.wicks.filter((wick) => wick.active && wick.lit > 0.55);
    if (active.length === 0 || this.drops.length >= CONFIG.melt.maxDrops) return;

    const wick = active[Math.floor(Math.random() * active.length)];
    const part = wick.part;
    if (!part.rimCandidates.length) return;

    // rimCandidates enthaelt logische (verschweisste) Vertex-Indizes.
    // Deren aktuelle Position steht in uniquePos, nicht im Renderbuffer.
    const vertex = part.rimCandidates[Math.floor(Math.random() * part.rimCandidates.length)];
    const ix = vertex * 3;
    const positions = part.uniquePos;
    const x = part.mesh.position.x + positions[ix];
    const y = CONFIG.tableY + positions[ix + 1];
    const z = part.mesh.position.z + positions[ix + 2];

    const centerX = part.mesh.position.x + (part.bbox.min.x + part.bbox.max.x) / 2;
    const centerZ = part.mesh.position.z + (part.bbox.min.z + part.bbox.max.z) / 2;
    let outwardX = x - centerX;
    let outwardZ = z - centerZ;
    const length = Math.hypot(outwardX, outwardZ) || 1;
    outwardX /= length;
    outwardZ /= length;

    const radius = rand(CONFIG.melt.radiusMin, CONFIG.melt.radiusMax);
    const temp = clamp(part.uniqueTemps[vertex], 0.35, 1);
    this.drops.push({
      position: new THREE.Vector3(
        x + outwardX * 0.025,
        y - 0.015,
        z + outwardZ * 0.025,
      ),
      velocity: new THREE.Vector3(
        outwardX * rand(0.03, 0.1),
        rand(-0.06, -0.01),
        outwardZ * rand(0.03, 0.1),
      ),
      radius,
      temp,
    });
  }

  // Zwei Tropfen in der Luft verschmelzen zu einem groesseren.
  merge() {
    for (let i = 0; i < this.drops.length; i++) {
      for (let j = i + 1; j < this.drops.length; j++) {
        const a = this.drops[i];
        const b = this.drops[j];
        const dx = a.position.x - b.position.x;
        const dy = a.position.y - b.position.y;
        const dz = a.position.z - b.position.z;
        const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (distance >= (a.radius + b.radius) * 0.86) continue;

        const volumeA = a.radius ** 3;
        const volumeB = b.radius ** 3;
        const total = volumeA + volumeB;
        a.position
          .multiplyScalar(volumeA / total)
          .addScaledVector(b.position, volumeB / total);
        a.velocity
          .multiplyScalar(volumeA / total)
          .addScaledVector(b.velocity, volumeB / total);
        a.radius = Math.cbrt(total);
        a.temp = (a.temp * volumeA + b.temp * volumeB) / total;
        this.drops.splice(j, 1);
        j--;
      }
    }
  }

  land(drop) {
    const volume = (4 / 3) * Math.PI * drop.radius ** 3 * CONFIG.puddles.volumeScale;
    state.puddles.add(drop.position.x, drop.position.z, volume, drop.temp);
  }

  updateInstances() {
    this.instanced.count = this.drops.length;
    for (let i = 0; i < this.drops.length; i++) {
      const drop = this.drops[i];
      this.dummy.position.copy(drop.position);
      const stretch = 1 + Math.min(1.7, Math.abs(drop.velocity.y) * 0.13);
      this.dummy.scale.set(drop.radius, drop.radius * stretch, drop.radius);
      this.dummy.updateMatrix();
      this.instanced.setMatrixAt(i, this.dummy.matrix);
    }
    this.instanced.instanceMatrix.needsUpdate = true;
  }

  clear() {
    this.drops.length = 0;
    this.instanced.count = 0;
    this.instanced.instanceMatrix.needsUpdate = true;
    this.spawnTimer = 0.8;
  }
}

// =====================================================================
//  9. PFUETZEN — addierte Metaballfelder auf Canvas 2D
// ---------------------------------------------------------------------
//  Jeder Tropfen ist ein weicher Radialgradient. Werden die Gradienten
//  addiert, verschmelzen benachbarte Tropfen zu einer gemeinsamen
//  Aequipotentialflaeche. Die Canvas-Textur wird als AlphaMap/Map und
//  als BumpMap auf eine flache Tischplatte gelegt. Das ist bewusst eine
//  performante 2D-Projektion der sonst 3D gedachten Metaball-Idee.
// =====================================================================

class PuddleSystem {
  constructor() {
    this.puddles = [];
    this.mode = CONFIG.physicsMode;

    this.colorCanvas = makeCanvas(CONFIG.puddles.canvasWidth, 256);
    this.colorCtx = this.colorCanvas.getContext('2d');
    this.fieldCanvas = makeCanvas(CONFIG.puddles.canvasWidth, 256);
    this.fieldCtx = this.fieldCanvas.getContext('2d');

    this.colorTexture = new THREE.CanvasTexture(this.colorCanvas);
    this.colorTexture.colorSpace = THREE.SRGBColorSpace;
    this.colorTexture.minFilter = THREE.LinearFilter;
    this.colorTexture.magFilter = THREE.LinearFilter;
    this.colorTexture.generateMipmaps = false;

    this.fieldTexture = new THREE.CanvasTexture(this.fieldCanvas);
    this.fieldTexture.colorSpace = THREE.NoColorSpace;
    this.fieldTexture.minFilter = THREE.LinearFilter;
    this.fieldTexture.magFilter = THREE.LinearFilter;
    this.fieldTexture.generateMipmaps = false;

    this.material = new THREE.MeshPhysicalMaterial({
      map: this.colorTexture,
      color: 0xffffff,
      transparent: true,
      opacity: 1,
      alphaTest: 0.012,
      roughness: 0.2,
      metalness: 0.0,
      clearcoat: 1.0,
      clearcoatRoughness: 0.18,
      bumpMap: this.fieldTexture,
      bumpScale: 0.085,
      envMapIntensity: 0.85,
      emissive: new THREE.Color(0x1a0802),
      emissiveIntensity: 0.35,
      depthWrite: false,
      side: THREE.DoubleSide,
    });

    this.plane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), this.material);
    this.plane.rotation.x = -Math.PI / 2;
    this.plane.frustumCulled = false;
    this.plane.renderOrder = 1;
    scene.add(this.plane);

    // PHYSICS: Alternative Darstellung — einzelne abgeflachte Tropfen.
    this.discMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      roughness: 0.18,
      metalness: 0.0,
      clearcoat: 1.0,
      clearcoatRoughness: 0.18,
      envMapIntensity: 0.8,
      emissive: new THREE.Color(0x170702),
      emissiveIntensity: 0.35,
    });
    this.discs = new THREE.InstancedMesh(
      new THREE.SphereGeometry(1, 18, 9),
      this.discMaterial,
      CONFIG.puddles.max,
    );
    this.discs.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.discs.frustumCulled = false;
    this.discs.count = 0;
    scene.add(this.discs);

    this.dummy = new THREE.Object3D();
    this.color = new THREE.Color();
    this.width = 8;
    this.depth = CONFIG.puddles.depth;
    this.minX = -4;
    this.maxX = 4;
    this.minZ = -this.depth / 2;
    this.maxZ = this.depth / 2;
    this.heightPx = 256;
  }

  configureBounds(wordWidth) {
    this.width = Math.max(6, wordWidth + CONFIG.puddles.margin * 2);
    this.depth = CONFIG.puddles.depth;
    this.minX = -this.width / 2;
    this.maxX = this.width / 2;
    this.minZ = -this.depth / 2;
    this.maxZ = this.depth / 2;

    // Canvas-Aspect = Welt-Aspect, damit ein runder Tropfen auch in der
    // Textur rund bleibt.
    this.heightPx = Math.max(160, Math.round(
      CONFIG.puddles.canvasWidth * this.depth / this.width,
    ));
    this.colorCanvas.height = this.heightPx;
    this.fieldCanvas.height = this.heightPx;

    this.plane.geometry.dispose();
    this.plane.geometry = new THREE.PlaneGeometry(this.width, this.depth);
    this.plane.position.set(0, CONFIG.tableY + 0.006, 0);
    this.clearCanvases();
    this.setMode(this.mode);
  }

  setMode(mode) {
    this.mode = mode;
    this.plane.visible = mode === 'metaballs';
    this.discs.visible = mode === 'discs';
    if (mode === 'discs') this.updateDiscs();
  }

  add(x, z, volume, temp) {
    const safeX = clamp(x, this.minX + 0.08, this.maxX - 0.08);
    const safeZ = clamp(z, this.minZ + 0.08, this.maxZ - 0.08);
    this.puddles.push({
      x: safeX,
      z: safeZ,
      volume: Math.max(0.00002, volume),
      thickness: CONFIG.puddles.thicknessStart,
      temp: clamp(temp, 0.2, 1),
      age: 0,
    });
    this.merge();
  }

  radiusOf(puddle) {
    return Math.sqrt(puddle.volume / (Math.PI * Math.max(0.001, puddle.thickness)));
  }

  update(dt) {
    for (const puddle of this.puddles) {
      puddle.age += dt;
      puddle.thickness = Math.max(
        CONFIG.puddles.thicknessMin,
        puddle.thickness - CONFIG.puddles.thicknessRate * dt,
      );
      puddle.temp = Math.max(0.16, puddle.temp - CONFIG.puddles.coolRate * dt);
    }

    this.merge();
    this.draw();

    if (this.mode === 'discs') this.updateDiscs();
  }

  // Logisches Verschmelzen: Das Volumen bleibt erhalten, der neue
  // Mittelpunkt ist nach Volumen gewichtet. Die sichtbare Verschmelzung
  // uebernimmt beim Metaball-Modus zusaetzlich das addierte Feld.
  merge() {
    let changed = true;
    while (changed && this.puddles.length > 1) {
      changed = false;
      for (let i = 0; i < this.puddles.length && !changed; i++) {
        for (let j = i + 1; j < this.puddles.length; j++) {
          const a = this.puddles[i];
          const b = this.puddles[j];
          const dx = a.x - b.x;
          const dz = a.z - b.z;
          const distance = Math.hypot(dx, dz);
          const reach = (this.radiusOf(a) + this.radiusOf(b)) * CONFIG.puddles.mergeFactor;
          if (distance > reach) continue;

          const volumeA = a.volume;
          const volumeB = b.volume;
          const total = volumeA + volumeB;
          a.x = (a.x * volumeA + b.x * volumeB) / total;
          a.z = (a.z * volumeA + b.z * volumeB) / total;
          a.thickness = (a.thickness * volumeA + b.thickness * volumeB) / total;
          a.temp = (a.temp * volumeA + b.temp * volumeB) / total;
          a.volume = total;
          a.age = Math.max(a.age, b.age);
          this.puddles.splice(j, 1);
          changed = true;
          break;
        }
      }
    }

    // Notbremse: nie mehr als das konfigurierte Maximum.
    while (this.puddles.length > CONFIG.puddles.max) {
      this.puddles.sort((a, b) => a.volume - b.volume);
      const small = this.puddles.shift();
      const into = this.puddles[0];
      const total = into.volume + small.volume;
      into.x = (into.x * into.volume + small.x * small.volume) / total;
      into.z = (into.z * into.volume + small.z * small.volume) / total;
      into.volume = total;
    }
  }

  draw() {
    const W = this.colorCanvas.width;
    const H = this.colorCanvas.height;
    this.colorCtx.clearRect(0, 0, W, H);
    this.fieldCtx.clearRect(0, 0, W, H);

    if (this.puddles.length === 0) {
      this.colorTexture.needsUpdate = true;
      this.fieldTexture.needsUpdate = true;
      return;
    }

    this.colorCtx.globalCompositeOperation = 'lighter';
    this.fieldCtx.globalCompositeOperation = 'lighter';

    for (const puddle of this.puddles) {
      const radius = this.radiusOf(puddle) * 1.16;
      const cx = ((puddle.x - this.minX) / this.width) * W;
      const cy = ((puddle.z - this.minZ) / this.depth) * H;
      const rp = Math.max(2.0, (radius / this.width) * W);

      const warm = clamp(puddle.temp, 0, 1);
      const red = Math.round(lerp(COLORS.puddleCool[0], COLORS.puddleWarm[0], warm) * 255);
      const green = Math.round(lerp(COLORS.puddleCool[1], COLORS.puddleWarm[1], warm) * 255);
      const blue = Math.round(lerp(COLORS.puddleCool[2], COLORS.puddleWarm[2], warm) * 255);

      const colorGradient = this.colorCtx.createRadialGradient(cx, cy, 0, cx, cy, rp);
      colorGradient.addColorStop(0.0, `rgba(${red},${green},${blue},0.96)`);
      colorGradient.addColorStop(0.52, `rgba(${red},${green},${blue},0.9)`);
      colorGradient.addColorStop(0.83, `rgba(${red},${green},${blue},0.34)`);
      colorGradient.addColorStop(1.0, `rgba(${red},${green},${blue},0)`);
      this.colorCtx.fillStyle = colorGradient;
      this.colorCtx.beginPath();
      this.colorCtx.arc(cx, cy, rp, 0, Math.PI * 2);
      this.colorCtx.fill();

      // Feld fuer den Bump: heller Kern, schwarzer Rand. Die Addition
      // mehrerer Felder erzeugt den weichen Uebergang.
      const fieldGradient = this.fieldCtx.createRadialGradient(cx, cy, 0, cx, cy, rp);
      fieldGradient.addColorStop(0.0, 'rgba(255,255,255,1)');
      fieldGradient.addColorStop(0.55, 'rgba(150,150,150,1)');
      fieldGradient.addColorStop(0.85, 'rgba(35,35,35,1)');
      fieldGradient.addColorStop(1.0, 'rgba(0,0,0,1)');
      this.fieldCtx.fillStyle = fieldGradient;
      this.fieldCtx.beginPath();
      this.fieldCtx.arc(cx, cy, rp, 0, Math.PI * 2);
      this.fieldCtx.fill();
    }

    this.colorCtx.globalCompositeOperation = 'source-over';
    this.fieldCtx.globalCompositeOperation = 'source-over';
    this.colorTexture.needsUpdate = true;
    this.fieldTexture.needsUpdate = true;
  }

  updateDiscs() {
    this.discs.count = Math.min(this.puddles.length, CONFIG.puddles.max);
    for (let i = 0; i < this.discs.count; i++) {
      const puddle = this.puddles[i];
      const radius = this.radiusOf(puddle);
      this.dummy.position.set(
        puddle.x,
        CONFIG.tableY + puddle.thickness * 0.36,
        puddle.z,
      );
      this.dummy.scale.set(radius, puddle.thickness * 0.55, radius);
      this.dummy.updateMatrix();
      this.discs.setMatrixAt(i, this.dummy.matrix);

      const warm = clamp(puddle.temp, 0, 1);
      this.color.setRGB(
        lerp(COLORS.puddleCool[0], COLORS.puddleWarm[0], warm),
        lerp(COLORS.puddleCool[1], COLORS.puddleWarm[1], warm),
        lerp(COLORS.puddleCool[2], COLORS.puddleWarm[2], warm),
      );
      this.discs.setColorAt(i, this.color);
    }
    this.discs.instanceMatrix.needsUpdate = true;
    if (this.discs.instanceColor) this.discs.instanceColor.needsUpdate = true;
  }

  clearCanvases() {
    this.colorCtx.clearRect(0, 0, this.colorCanvas.width, this.colorCanvas.height);
    this.fieldCtx.clearRect(0, 0, this.fieldCanvas.width, this.fieldCanvas.height);
    this.colorTexture.needsUpdate = true;
    this.fieldTexture.needsUpdate = true;
  }

  clear() {
    this.puddles.length = 0;
    this.clearCanvases();
    this.discs.count = 0;
    this.discs.instanceMatrix.needsUpdate = true;
  }
}

// =====================================================================
//  10. SPLITTER — ein Stueck Bruch mit parabolischer Flugbahn
// =====================================================================

class ShardSystem {
  constructor() {
    this.shards = [];
    this.box = new THREE.Box3();
  }

  spawn(part) {
    if (this.shards.length >= CONFIG.shards.max) return null;
    // split() schneidet das Mesh an einer Ebene und liefert einen
    // geschlossenen, gecappten Brocken samt Hauptrest zurueck.
    const chunk = part.split();
    if (!chunk) return null;

    const mesh = new THREE.Mesh(chunk.geometry, materials.shard);
    mesh.position.copy(chunk.center);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    const outward = chunk.center.clone();
    outward.y = 0;
    if (outward.lengthSq() < 0.0001) outward.set(rand(-1, 1), 0, rand(-0.4, 0.4));
    outward.normalize();

    this.shards.push({
      mesh,
      velocity: new THREE.Vector3(
        outward.x * rand(0.25, 0.7) + rand(-0.15, 0.15),
        rand(0.55, 1.2),
        outward.z * rand(0.25, 0.7) + rand(-0.18, 0.18),
      ),
      angularVelocity: new THREE.Vector3(
        rand(-4.5, 4.5),
        rand(-5.5, 5.5),
        rand(-4.5, 4.5),
      ),
      volume: chunk.volume,
      restTime: 0,
      meltTime: 0,
      settled: false,
    });

    part.stress = 0;
    part.cooldown = CONFIG.shards.cooldown;
    return mesh;
  }

  update(dt) {
    for (let i = this.shards.length - 1; i >= 0; i--) {
      const shard = this.shards[i];
      const mesh = shard.mesh;

      if (!shard.settled) {
        shard.velocity.y -= CONFIG.shards.gravity * dt;
        shard.velocity.multiplyScalar(Math.max(0, 1 - CONFIG.shards.drag * dt));
        mesh.position.addScaledVector(shard.velocity, dt);
        mesh.rotation.x += shard.angularVelocity.x * dt;
        mesh.rotation.y += shard.angularVelocity.y * dt;
        mesh.rotation.z += shard.angularVelocity.z * dt;

        mesh.updateMatrixWorld(true);
        this.box.setFromObject(mesh);

        // TABLE: Auch Splitter kennen nur die eine Kollisionsebene.
        if (this.box.min.y < CONFIG.tableY) {
          mesh.position.y += CONFIG.tableY - this.box.min.y;
          if (shard.velocity.y < 0) shard.velocity.y *= -0.18;
          shard.velocity.x *= 0.64;
          shard.velocity.z *= 0.64;
          shard.angularVelocity.multiplyScalar(0.55);
          shard.restTime += dt;
          if (shard.restTime > 0.55) {
            shard.settled = true;
            shard.velocity.set(0, 0, 0);
            shard.angularVelocity.set(0, 0, 0);
          }
        } else {
          shard.restTime = 0;
        }
      } else {
        shard.meltTime += dt;
        if (shard.meltTime > CONFIG.shards.restMeltDelay) {
          const fade = clamp(
            (shard.meltTime - CONFIG.shards.restMeltDelay) / 0.9,
            0,
            1,
          );
          mesh.scale.setScalar(Math.max(0.001, 1 - fade));
          if (fade >= 1) {
            const volume = shard.volume * 1.2;
            state.puddles.add(mesh.position.x, mesh.position.z, volume, 0.5);
            scene.remove(mesh);
            mesh.geometry.dispose();
            this.shards.splice(i, 1);
          }
        }
      }
    }
  }

  clear() {
    for (const shard of this.shards) {
      scene.remove(shard.mesh);
      shard.mesh.geometry.dispose();
    }
    this.shards.length = 0;
  }
}

// =====================================================================
//  11. AUFBAU, RESET UND RENDER-LOOP
// =====================================================================

const loaderElement = document.getElementById('loader');
const loaderText = document.getElementById('loaderText');
const debugElement = document.getElementById('debug');
const fadeElement = document.getElementById('fade');
const hudElement = document.getElementById('hud');
const subtitleElement = document.querySelector('.subtitle');

let composer = null;
let bloomPass = null;
let debugTimer = 0;
const clock = new THREE.Clock();

function setupComposer() {
  if (!CONFIG.bloom) return;
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.34,
    0.64,
    0.84,
  );
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
  composer.setSize(window.innerWidth, window.innerHeight);
}

function onResize() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.65));
  renderer.setSize(width, height);
  if (composer) composer.setSize(width, height);
  fitCamera(state.model ? state.model.width : 8);
}

function updateWind(dt) {
  const smoothing = 1 - Math.exp(-CONFIG.wind.smooth * dt);
  state.wind.lerp(state.windTarget, smoothing);
}

function updateDust(dt) {
  if (!dust) return;
  const positions = dust.geometry.attributes.position.array;
  for (let i = 0; i < positions.length; i += 3) {
    positions[i + 1] += (0.012 + (i % 9) * 0.0025) * dt;
    positions[i + 0] += state.wind.x * 0.022 * dt;
    positions[i + 2] += state.wind.z * 0.022 * dt;
    if (positions[i + 1] > CONFIG.tableY + 4.8) {
      positions[i + 1] = CONFIG.tableY + 0.1;
      positions[i + 0] = rand(-7, 7);
      positions[i + 2] = rand(-3.5, 4.5);
    }
  }
  dust.geometry.attributes.position.needsUpdate = true;
}

function updateScene(dt) {
  state.elapsed += dt;
  state.normalFrame++;
  updateWind(dt);

  // Reihenfolge: erst die Dochte (Hitzequelle bewegen), dann die
  // Buchstaben (Temperatur + Schmelze), dann die Wachssysteme.
  for (const wick of state.wicks) {
    wick.update(dt, state.time, state.elapsed);
  }
  for (const part of state.parts) {
    part.update(dt);
  }

  // Bruch: heisse, duenne Stellen verlieren ihre Stabilitaet. canBreak()
  // prueft Cooldown, Gewicht und ob ueberhaupt genug Wachs geschmolzen ist.
  for (const part of state.parts) {
    if (!part.canBreak()) continue;
    state.shards.spawn(part);
  }

  state.drops.update(dt);
  state.puddles.update(dt);
  state.shards.update(dt);
  updateSmoke(dt);
  updateDust(dt);

  if (bokeh) {
    bokeh.material.opacity = 0.62 + Math.sin(state.time * 0.65) * 0.1;
  }

  if (state.elapsed > CONFIG.loopSeconds && !state.resetting) {
    requestReset();
  }
}

function requestReset() {
  if (state.resetting) return;
  state.resetting = true;
  fadeElement.style.opacity = '1';
  window.setTimeout(() => {
    resetScene();
    fadeElement.style.opacity = '0';
    state.resetting = false;
  }, 1150);
}

function resetScene() {
  state.elapsed = 0;
  state.time = 0;
  state.normalFrame = 0;
  state.smokeTimer = 0;
  state.wind.set(0, 0, 0);
  state.windTarget.set(0, 0, 0);

  for (const part of state.parts) part.reset();
  for (const wick of state.wicks) wick.reset();
  state.drops.clear();
  state.puddles.clear();
  state.shards.clear();

  for (const puff of state.smoke) {
    puff.life = 0;
    puff.sprite.visible = false;
    puff.material.opacity = 0;
  }
}

function renderFrame() {
  if (composer) composer.render();
  else renderer.render(scene, camera);
}

function updateFps(rawDt) {
  state.fpsFrames++;
  state.fpsTime += rawDt;
  if (state.fpsTime >= 0.5) {
    state.fps = state.fpsFrames / state.fpsTime;
    state.fpsFrames = 0;
    state.fpsTime = 0;
  }
}

function updateDebug(rawDt) {
  if (!debugElement.classList.contains('visible')) return;
  debugTimer -= rawDt;
  if (debugTimer > 0) return;
  debugTimer = 0.22;

  const vertices = state.parts.reduce((sum, part) => sum + part.count, 0);
  const activeWicks = state.wicks.filter((wick) => wick.active).length;
  const lines = [
    `FPS        ${state.fps.toFixed(1)}`,
    `Modell     ${state.model ? state.model.kind : '-'} · ${state.parts.length} Teile · ${vertices} Vertices`,
    `Physik     ${CONFIG.physicsMode}`,
    `Tropfen    ${state.drops ? state.drops.drops.length : 0}`,
    `Pfuetzen   ${state.puddles ? state.puddles.puddles.length : 0}`,
    `Splitter   ${state.shards ? state.shards.shards.length : 0}`,
    `Dochte     ${activeWicks}/${state.wicks.length}`,
    `Zeit       ${state.elapsed.toFixed(1)} / ${CONFIG.loopSeconds} s`,
    '',
    'Kraefte: Schwerkraft · Luftwiderstand · Wind',
    '         Waerme · Oberflaechenspannung · Kollision',
  ];
  debugElement.textContent = lines.join('\n');
}

function animate() {
  requestAnimationFrame(animate);
  const rawDt = Math.min(clock.getDelta(), 0.05);
  if (!state.ready) return;

  if (!state.paused && !state.resetting) {
    updateScene(rawDt);
    state.time += rawDt;
  }

  renderFrame();
  updateFps(rawDt);
  updateDebug(rawDt);
}

function showFatalError(error) {
  console.error(error);
  loaderElement.classList.remove('done');
  loaderElement.innerHTML = `
    <p class="error">
      Die Szene konnte nicht gestartet werden.<br><br>
      ${String(error && error.message ? error.message : error)}
      <br><br>
      Bitte die Seite ueber einen lokalen Server oeffnen
      (z.&nbsp;B. <code>python3 -m http.server</code>) und die Internetverbindung pruefen.
    </p>
  `;
}

async function init() {
  try {
    setupLights();
    setupEnvironment();
    initSmoke();

    loaderText.textContent = 'Wachs wird gegossen …';
    const model = await loadModel();
    state.model = model;
    state.parts = model.parts;
    state.wicks = model.wicks;
    scene.add(model.group);
    model.group.position.y = CONFIG.tableY;

    state.puddles = new PuddleSystem();
    state.puddles.configureBounds(model.width);
    state.drops = new DropletSystem();
    state.shards = new ShardSystem();

    fitCamera(model.width);
    setupComposer();

    state.ready = true;
    loaderElement.classList.add('done');
    window.setTimeout(() => loaderElement.remove(), 1000);
    clock.getDelta();
    animate();
  } catch (error) {
    showFatalError(error);
  }
}

// =====================================================================
//  12. EINGABE
// =====================================================================

window.addEventListener('resize', onResize);

window.addEventListener('pointermove', (event) => {
  const nx = (event.clientX / window.innerWidth) * 2 - 1;
  const ny = (event.clientY / window.innerHeight) * 2 - 1;
  state.windTarget.set(
    nx * CONFIG.wind.strength,
    0,
    ny * CONFIG.wind.strength * 0.55,
  );
});

window.addEventListener('pointerleave', () => {
  state.windTarget.set(0, 0, 0);
});

window.addEventListener('keydown', (event) => {
  const key = event.key.toLowerCase();
  if (key === 'r') {
    requestReset();
  } else if (key === 'p') {
    state.paused = !state.paused;
    if (subtitleElement) {
      subtitleElement.textContent = state.paused
        ? 'Pause — die Kerze wartet.'
        : 'Eine Kerze, die aus einem Wort besteht.';
    }
    clock.getDelta();
  } else if (key === 'd') {
    debugElement.classList.toggle('visible');
  } else if (key === 'h') {
    hudElement.classList.toggle('hidden');
  }
});

window.addEventListener('visibilitychange', () => {
  if (!document.hidden) clock.getDelta();
});

// Kleine, harmlose Debug-Schnittstelle fuer die Entwicklung. Sie erlaubt
// es, den Zustand im Browser ohne DevTools zu pruefen.
window.__CANDLE__ = { state, CONFIG, scene, camera, renderer, THREE };
window.__CANDLE_ERRORS__ = [];
window.addEventListener('error', (event) => {
  window.__CANDLE_ERRORS__.push(String(event.message || event.error || event));
});
window.addEventListener('unhandledrejection', (event) => {
  window.__CANDLE_ERRORS__.push(String(event.reason || event));
});

init();

  </script>
</body>
